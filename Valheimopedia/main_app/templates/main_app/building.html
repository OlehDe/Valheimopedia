{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Будівництво - Valheimopedia</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="{% static 'css/building.css' %}">
  <link rel="stylesheet" href="{% static 'css/building_detail.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1 class="category-title">Valheimopedia</h1>
  <div class="auth-buttons">
    {% if user.is_authenticated %}
      <a href="/account">Акаунт</a>
    {% else %}
      <a href="/login">Увійти</a>
      <a href="/register">Зареєструватися</a>
    {% endif %}
  </div>
</header>

<nav>
  <div class="nav-button">
    <a href="/">Головна</a>
  </div>
  <div class="nav-button">
    <a href="{% url 'main_app:all_items' %}">Усі предмети</a>
  </div>
  <div class="nav-button">
    <a href="{% url 'main_app:building' %}">Будівництво</a>
  </div>
</nav>

<main>

  <h1 class="category-title building-page-title">🏠 Будівництво</h1>

  <div class="category-filters" id="category-filters">
    <button type="button" class="active" data-category="Всі">Всі</button>
  </div>

  <div class="search-section">
    <div class="search-wrapper">
      <input type="text" id="search-input" class="search-input" placeholder="Пошук предметів...">
    </div>
    <div class="sort-wrapper">
      <span class="sort-label">Сортувати за:</span>
      <select id="sort-select" class="sort-select">
        <option value="name-asc" selected>Назвою (А–я)</option>
        <option value="name-desc">Назвою (Я–а)</option>
      </select>
    </div>
  </div>

  <div id="items-grid" class="items-grid">
    <!-- Картки будуть додані JS -->
  </div>

</main>

{{ building_items|json_script:"building-data" }}

<script src="{% static 'js/building.js' %}"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const mainContainer = document.getElementById('items-grid');
    const itemsDataElement = document.getElementById('building-data');

    if (!mainContainer || !itemsDataElement) {
        console.error('Елементи не знайдено');
        return;
    }

    let buildingItems;
    try {
        buildingItems = JSON.parse(itemsDataElement.textContent);
        if (!Array.isArray(buildingItems)) throw new Error('Дані не масив');
        console.log('Завантажено предметів:', buildingItems.length);
    } catch (e) {
        mainContainer.innerHTML = '<p class="empty-message">Помилка завантаження даних</p>';
        return;
    }

    // Спрощене відображення без фільтрів
    function render() {
        mainContainer.innerHTML = '';
        buildingItems.forEach(item => {
            const card = document.createElement('a');
            card.href = `/building/${item.token}/`;
            card.className = 'item-card item-card-link';
            card.innerHTML = `
                <div class="item-image-container">
                    ${item.image_url ? `<img src="${item.image_url}" alt="${item.name}" class="item-image">` : '<div class="item-image-placeholder">🏗️</div>'}
                </div>
                <div class="item-info">
                    <h3>${item.name}</h3>
                    <div class="item-type-badge">${item.type}</div>
                </div>
            `;
            mainContainer.appendChild(card);
        });
    }

    render();
});
</script>

</body>
</html>
