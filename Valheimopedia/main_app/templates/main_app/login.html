{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизація - Valheimopedia</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1 class="category-title">Valheimopedia</h1>
  <div class="auth-buttons">
    <a href="/">Головна</a>
    <a href="/login">Увійти</a>
    <a href="/register">Реєстрація</a>
  </div>
</header>

<main>
  <div class="login-form">
    <h2>Вхід в систему</h2>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Ім'я користувача</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Увійти</button>
      <div class="form-footer">
        Ще не зареєстровані? <a href="/register">Створити акаунт</a>
      </div>

      <div class="login-card">
        <div id="g_id_onload"
             data-client_id="98752258613-fknakg3i31mlup5brk50coigelbf0bnri.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="outline"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left">
        </div>

        <p style="margin-top: 2rem; font-size: 0.9rem; color: #666;">
            Натисніть кнопку, щоб увійти через Google
        </p>
    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    </form>
  </div>
</main>

</body>
</html>
